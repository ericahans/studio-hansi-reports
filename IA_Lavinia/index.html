<style>
:root{
  --bg:#E6F4EC; --surface:#FFFFFF; --ink:#3A2340; --muted:#7A6A80;
  --accent:#E8475B; --line:#CFE6D7; --chip:#FFE7EA; --dim:.22; --ok:#2E7D4F; --no:#B0475A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B2420; --surface:#26302B; --ink:#F4EAF2; --muted:#B9ABBD;
    --accent:#FF7386; --line:#35453C; --chip:#40292E; --ok:#7FD39F; --no:#FF9AAB; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2420; --surface:#26302B; --ink:#F4EAF2; --muted:#B9ABBD;
  --accent:#FF7386; --line:#35453C; --chip:#40292E; --ok:#7FD39F; --no:#FF9AAB; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,system-ui,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:28px 18px 56px}
h1,h2{font-family:"Fredoka","Nunito",ui-rounded,sans-serif;margin:0}
h1{font-size:clamp(2.3rem,9vw,3.6rem);font-weight:700;line-height:1;color:var(--accent);letter-spacing:-.01em}
.sub{color:var(--muted);margin:10px 0 0;font-size:1.05rem}
.hero{position:relative;padding:8px 0 22px}
.garland{display:flex;gap:2px;margin-top:22px;flex-wrap:wrap}
.garland svg{width:44px;height:44px;animation:hop .6s ease-out both}
@keyframes hop{0%{transform:translateY(14px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.garland svg{animation:none}}

h2{font-size:1.6rem;font-weight:600;margin:34px 0 4px}
.hint{color:var(--muted);margin:0 0 14px;font-size:.95rem}

.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sticker{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit;text-align:left;transition:border-color .15s,transform .15s}
.sticker svg{width:46px;height:46px;flex:none}
.sticker b{display:block;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;line-height:1.2}
.sticker small{color:var(--muted);font-size:.82rem}
.sticker em{display:block;font-style:normal;font-size:.78rem;font-weight:700;color:var(--ok);line-height:1.2;margin-top:2px}
.sticker em.no{color:var(--no)}
.sticker[aria-pressed="true"]{border-color:var(--accent);transform:rotate(-2deg);background:var(--chip)}
.sticker:focus-visible,.clear:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.clear{margin-top:12px;background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:4px 0;visibility:hidden}
.clear.on{visibility:visible}

.week{margin-top:26px}
.week h3{font-family:"Fredoka",sans-serif;font-weight:500;font-size:1.05rem;color:var(--muted);margin:0 0 10px}
.day{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;background:var(--surface);border-radius:20px;padding:12px 14px;margin-bottom:8px;transition:opacity .2s}
.day.dim{opacity:var(--dim)}
.date{text-align:center;line-height:1}
.date strong{display:block;font-family:"Fredoka",sans-serif;font-size:1.9rem;font-weight:700;color:var(--accent)}
.date span{font-size:.8rem;color:var(--muted);font-weight:700}
.foods{display:flex;flex-wrap:wrap;gap:6px 14px}
.food{display:flex;flex-direction:column;align-items:center;width:64px;text-align:center}
.food svg{width:48px;height:48px}
.food b{font-size:.8rem;font-weight:700;line-height:1.15}
.food i{font-style:normal;font-size:.7rem;color:var(--muted);line-height:1.15}
.today{box-shadow:0 0 0 2px var(--accent) inset}
footer{margin-top:34px;color:var(--muted);font-size:.85rem}
</style>

      <path d="M32 18 C 18 18, 10 28, 12 38 C 14 48, 24 52, 32 58 C 40 52, 50 48, 52 38 C 54 28, 46 18, 32 18Z" fill="#9C1F55" stroke="#651338" stroke-width="2"/>

<main>
  <header class="hero">
    <h1>O cardápio da Lavínia</h1>
    <p class="sub">Introdução alimentar desde 15 de outubro</p>
    <div class="garland" id="garland" aria-hidden="true"></div>
  </header>

  <section aria-labelledby="ja">
    <h2 id="ja">Já provou <span id="total"></span> alimentos</h2>
    <p class="hint">Toque numa comida para ver os dias em que ela apareceu.</p>
    <div class="stickers" id="stickers"></div>
    <button class="clear" id="clear" type="button">Mostrar todos os dias</button>
  </section>

  <section aria-labelledby="cal">
    <h2 id="cal">Dia a dia</h2>
    <div id="calendar"></div>
  </section>

  <footer>De 19/10 a 25/10 a refeição não foi anotada. 06/11 sem registro.</footer>
</main>

<script>
const FOODS = {
  banana:{name:"Banana"}, maca:{name:"Maçã"}, mandioquinha:{name:"Mandioquinha"},
  manga:{name:"Manga", note:"⚠ possível alergia (08/11)", bad:true}, pera:{name:"Pera"}, mamao:{name:"Mamão"},
  morango:{name:"Morango"}, kiwi:{name:"Kiwi"}, abobora:{name:"Abóbora cabotiá"},
  feijao:{name:"Feijão preto"}, abobrinha:{name:"Abobrinha"},
  pessego:{name:"Pêssego", note:"♥ amou"}, ovo:{name:"Ovo", note:"✓ sem alergia"},
  brocolis:{name:"Brócolis"}, batata:{name:"Batata"}, melao:{name:"Melão", note:"♥ amou"},
  cenoura:{name:"Cenoura"}, kiwiamarelo:{name:"Kiwi amarelo", note:"♥ amou"},
  frango:{name:"Frango"}, arroz:{name:"Arroz branco"},
  tilapia:{name:"Tilápia", note:"✓ comeu bem"},
  batataasterix:{name:"Batata asterix", note:"✗ não gostou", bad:true},
  carne:{name:"Carne"}, melancia:{name:"Melancia"},
  feijaocarioca:{name:"Feijão carioca"}, beterraba:{name:"Beterraba"}, couve:{name:"Couve"}
};
const DAYS = [
  {d:"15/10",w:"qui",items:[["banana","lanche manhã"],["banana","lanche tarde"]]},
  {d:"16/10",w:"sex",items:[["maca","purê, lanche manhã"],["mandioquinha","almoço"],["banana","lanche tarde"]]},
  {d:"17/10",w:"sáb",items:[["banana","lanche manhã"],["manga","lanche tarde"]]},
  {d:"18/10",w:"dom",items:[["pera","lanche tarde"]]},
  {d:"19/10",w:"seg",items:[["pera"]]},
  {d:"20/10",w:"ter",items:[["mamao"]]},
  {d:"21/10",w:"qua",items:[["banana"],["morango"]]},
  {d:"22/10",w:"qui",items:[["kiwi"],["mamao"]]},
  {d:"23/10",w:"sex",items:[["banana"],["manga"]]},
  {d:"24/10",w:"sáb",items:[["maca"],["kiwi"],["banana"]]},
  {d:"25/10",w:"dom",items:[["banana"]]},
  {d:"26/10",w:"seg",items:[["mamao","lanche manhã"],["abobora","almoço"],["maca"]]},
  {d:"27/10",w:"ter",items:[["banana","lanche manhã"],["feijao"],["abobrinha"],["pessego"]]},
  {d:"28/10",w:"qua",items:[["pessego"],["feijao"],["abobora","purê"]]},
  {d:"29/10",w:"qui",items:[["ovo","mexido, manhã · sem alergia"],["banana","manhã"],["brocolis"],["batata","purê"],["melao","amou!"]]},
  {d:"30/10",w:"sex",items:[["banana"],["cenoura"],["feijao"],["brocolis"]]},
  {d:"31/10",w:"sáb",items:[["banana","manhã"],["cenoura","almoço"],["brocolis","almoço"],["melao","noite"]]},
  {d:"01/11",w:"dom",items:[["kiwiamarelo","1ª vez"],["abobora"],["feijao"],["cenoura"]]},
  {d:"02/11",w:"seg",items:[["kiwiamarelo","manhã · amou!"],["frango","1ª vez"],["arroz","1ª vez"]]},
  {d:"03/11",w:"ter",items:[["kiwiamarelo","manhã"],["frango","almoço"],["arroz","almoço"],["melao","tarde"]]},
  {d:"04/11",w:"qua",items:[["banana","manhã"],["tilapia","1ª vez, almoço · comeu bem"],["batataasterix","com alecrim · não gostou"]]},
  {d:"05/11",w:"qui",items:[["melao","manhã"],["feijao","almoço · comeu super bem"],["abobora","almoço"],["frango","almoço"],["kiwiamarelo","tarde"]]},
  {d:"07/11",w:"sáb",items:[["banana"],["carne","1ª vez"],["feijao"],["abobora"],["melancia","1ª vez"]]},
  {d:"08/11",w:"dom",items:[["frango"],["abobora"],["manga","⚠ possível alergia"]]},
  {d:"09/11",w:"seg",items:[["morango","dois"]]},
  {d:"10/11",w:"ter",items:[["feijaocarioca","1ª vez"],["beterraba","1ª vez"],["frango"],["banana","tarde"]]},
  {d:"11/11",w:"qua",items:[["morango","manhã"],["carne"],["feijaocarioca","com couve"],["couve","1ª vez, no feijão"],["beterraba","no cozimento do feijão"],["abobora"],["maca","gala, tarde"]]}
];
const WEEKS = [["Semana de 12 a 18/10",0,4],["Semana de 19 a 25/10",4,11],["Semana de 26/10 a 01/11",11,18],["Semana de 02 a 08/11",18,24],["Semana de 09 a 15/11",24,27]];
const icon = k => `<svg viewBox="0 0 64 64" role="img" aria-label="${FOODS[k].name}"><use href="#${k}"/></svg>`;

const first = {}, count = {};
DAYS.forEach(day => day.items.forEach(([k]) => { first[k] ??= day.d; count[k] = (count[k]||0)+1; }));
const order = Object.keys(FOODS).sort((a,b)=>DAYS.findIndex(x=>x.d===first[a]) - DAYS.findIndex(x=>x.d===first[b]));

document.getElementById("garland").innerHTML =
  order.map((k,i)=>`<svg viewBox="0 0 64 64" style="animation-delay:${i*70}ms"><use href="#${k}"/></svg>`).join("");

document.getElementById("total").textContent = order.filter(k=>first[k]).length;
const st = document.getElementById("stickers");
st.innerHTML = order.map(k=>`<button class="sticker" type="button" data-k="${k}" aria-pressed="false">${icon(k)}<span><b>${FOODS[k].name}</b><small>desde ${first[k]}, ${count[k]}×</small>${FOODS[k].note?`<em${FOODS[k].bad?' class="no"':''}>${FOODS[k].note}</em>`:""}</span></button>`).join("");

const today = (()=>{const t=new Date();return String(t.getDate()).padStart(2,"0")+"/"+String(t.getMonth()+1).padStart(2,"0")})();
document.getElementById("calendar").innerHTML = WEEKS.map(([t,a,b])=>`
  <div class="week"><h3>${t}</h3>${DAYS.slice(a,b).map(day=>`
    <div class="day${day.d===today?" today":""}" data-foods="${day.items.map(i=>i[0]).join(" ")}">
      <div class="date"><strong>${day.d.slice(0,2)}</strong><span>${day.w}</span></div>
      <div class="foods">${day.items.map(([k,m])=>`<div class="food">${icon(k)}<b>${FOODS[k].name}</b>${m?`<i>${m}</i>`:""}</div>`).join("")}</div>
    </div>`).join("")}</div>`).join("");

let active = null;
const clear = document.getElementById("clear");
function apply(){
  st.querySelectorAll(".sticker").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===active));
  document.querySelectorAll(".day").forEach(el=>el.classList.toggle("dim", !!active && !el.dataset.foods.split(" ").includes(active)));
  clear.classList.toggle("on", !!active);
}
st.addEventListener("click", e=>{const b=e.target.closest(".sticker"); if(!b) return; active = active===b.dataset.k ? null : b.dataset.k; apply();});
clear.addEventListener("click", ()=>{active=null; apply();});
</script>

</body></html>
